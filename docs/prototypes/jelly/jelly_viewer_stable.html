<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>JELLY TANK — selection, live</title>
<style>
  :root{
    --ink:#8fb3c7; --ink-dim:#4f7186; --panel:rgba(10,28,44,.72);
    --accent:#5ee8d8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#04101e;
    font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,monospace;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #tank{position:fixed;inset:0;display:block}
  .hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;
    padding:12px 14px 0;pointer-events:none;color:var(--ink)}
  .hud h1{font-size:12px;font-weight:600;letter-spacing:.18em;color:var(--accent)}
  .hud .sub{font-size:10px;margin-top:3px;color:var(--ink-dim);letter-spacing:.06em;max-width:56%}
  .hud .tick{position:absolute;right:14px;top:40px;font-size:10px;color:#9db8c9;text-align:right;line-height:1.6;white-space:pre-line;background:rgba(6,20,32,.62);padding:5px 9px;border-radius:8px}
  .bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0) + 12px);
    display:flex;justify-content:center;gap:10px}
  .bar button{
    pointer-events:auto;border:1px solid rgba(94,232,216,.28);
    background:var(--panel);color:var(--ink);
    font:inherit;font-size:12px;letter-spacing:.08em;
    padding:8px 11px;border-radius:999px;backdrop-filter:blur(6px)}
  .bar button:active{background:rgba(94,232,216,.16)}
  .gravrow{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0) + 64px);
    display:flex;justify-content:center;align-items:center;gap:10px;
    font-size:10px;color:var(--ink)}
  .gravrow input{width:170px;accent-color:#5ee8d8;pointer-events:auto}
  .hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0) + 58px);
    text-align:center;font-size:10px;color:var(--ink-dim);letter-spacing:.1em;
    pointer-events:none;transition:opacity 1.2s}
</style>
</head>
<body>
<canvas id="tank"></canvas>
<div class="hud">
  <h1>JELLY&nbsp;TANK&nbsp;·&nbsp;SELECTION</h1>
  <div class="sub">genome{metab·sens·suck·pulse·topt} · warm top / cold depth · color=lineage</div>
  <div class="tick" id="tick">t=0</div>
</div>
<div class="hint" id="hint">タップ: クラゲ=突く / 水=餌。満腹で分裂・飢えで死。最長生存の系統は次回セッションへ引き継がれる</div>
<div class="gravrow" id="gravRow" style="display:none">
  <span id="gravVal">g ×1.0</span>
  <input id="gravSlider" type="range" min="0" max="200" value="100">
</div>
<div class="bar">
  <button id="btnPause">⏸ pause</button>
  <button id="btnAdd">+ immigrant</button>
  <button id="btnLight">📷 light</button>
  <button id="btnTilt">🧭 tilt</button>
  <input id="lightInput" type="file" accept="image/*" style="display:none">
</div>
<script>
"use strict";
/* ---------- validated ring dynamics (port of j2_wave_amplitude.py) ---------- */
const N=16, THETA=0.5, EMAX=1.0, DELTA=0.5, K=0.6, R0=14, G=0.85, DRAG=0.1;
const THRUST=0.055;

function stepAmp(j){
  const nE=new Float32Array(N), nR=new Int16Array(N), nA=new Float32Array(N);
  const fired=[];
  for(let i=0;i<N;i++){
    if(j.R[i]>0){ nR[i]=j.R[i]-1; continue; }
    let inp=0, src=0;
    const nb1=(i+N-1)%N, nb2=(i+1)%N;
    if(j.E[nb1]>=EMAX){ inp+=K; if(j.A[nb1]>src)src=j.A[nb1]; }
    if(j.E[nb2]>=EMAX){ inp+=K; if(j.A[nb2]>src)src=j.A[nb2]; }
    const e=j.E[i]*DELTA+inp;
    if(e>=THETA){ nE[i]=EMAX; nR[i]=R0; nA[i]=src*G; fired.push([i,src*G]); }
    else nE[i]=e;
  }
  j.E=nE; j.R=nR; j.A=nA; return fired;
}

/* ---------- plankton field ---------- */
const CS=28;
let lightMap=null, lightBmp=null, lightBg=null;
async function setLightFromFile(file){
  try{
    try{ lightBmp=await createImageBitmap(file,{imageOrientation:'from-image'}); }
    catch(e){ lightBmp=await createImageBitmap(file); }
    buildLight();
  }catch(e){}
}
function buildLight(){
  if(!lightBmp||!GW){ lightMap=null; lightBg=null; tempMap=null; return; }
  const c=document.createElement('canvas'); c.width=GW; c.height=GH;
  const cc=c.getContext('2d'); cc.drawImage(lightBmp,0,0,GW,GH);
  const d=cc.getImageData(0,0,GW,GH).data;
  const L=new Float32Array(GW*GH); let mn=1,mx=0;
  for(let i=0;i<L.length;i++){
    const v=(0.2126*d[i*4]+0.7152*d[i*4+1]+0.0722*d[i*4+2])/255;
    L[i]=v; if(v<mn)mn=v; if(v>mx)mx=v;
  }
  const rg=Math.max(0.05,mx-mn);
  for(let i=0;i<L.length;i++) L[i]=(L[i]-mn)/rg;
  lightMap=L;
  const TM=new Float32Array(GW*GH);          // hue -> water temperature
  for(let i=0;i<TM.length;i++){
    const r=d[i*4], gg=d[i*4+1], bch=d[i*4+2];
    const w=(r-bch)/Math.max(40, r, gg, bch); // color purity, brightness-normalized
    TM[i]=0.5+0.95*w;                         // saturated red -> ~1.45, saturated blue -> ~-0.45; white/gray -> 0.5
  }
  tempMap=TM;
  const b=document.createElement('canvas'); b.width=W; b.height=H;
  b.getContext('2d').drawImage(lightBmp,0,0,W,H);
  lightBg=b;
}
let GW=0,GH=0,P=null;
function rebuildField(){
  GW=Math.max(4,Math.ceil(W/CS)); GH=Math.max(4,Math.ceil(H/CS));
  P=new Float32Array(GW*GH);
  for(let i=0;i<P.length;i++) P[i]=((i%GW)>=GW/2)?0.35*Math.random():0;
}
function idx(gx,gy){ return ((gy+GH)%GH)*GW + ((gx+GW)%GW); }
function fieldAt(x,y){ return P[idx(Math.floor(x/CS),Math.floor(y/CS))]; }
function fieldStep(){
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){
    const i=idx(gx,gy), p=P[i];
    const L=lightMap?lightMap[i]:(gx>=GW/2?1:0);   // real light drives plankton when a photo is set
    P[i]=Math.min(1, p*(0.9975+0.0025*L) + 0.00034*L + 0.0032*L*p*(1-p));
  }
  const Q=new Float32Array(P.length), r=0.018;
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){
    const i=idx(gx,gy);
    const nsum=P[idx(gx-1,gy)]+P[idx(gx+1,gy)]+P[idx(gx,gy-1)]+P[idx(gx,gy+1)];
    Q[i]=P[i]*(1-r)+nsum*(r/4);
  }
  P=Q;
}
function fieldDeposit(x,y,amt,rad){
  const cg=Math.ceil(rad/CS), cgx=Math.floor(x/CS), cgy=Math.floor(y/CS);
  for(let dy=-cg;dy<=cg;dy++)for(let dx=-cg;dx<=cg;dx++){
    const d2=dx*dx+dy*dy;
    if(d2<=cg*cg){
      const i=idx(cgx+dx,cgy+dy);
      P[i]=Math.min(1,P[i]+amt*Math.exp(-d2/(cg*0.7+0.4)));
    }
  }
}
function fieldEat(x,y,rad,frac){
  const cg=Math.ceil(rad/CS), cgx=Math.floor(x/CS), cgy=Math.floor(y/CS);
  let eaten=0;
  for(let dy=-cg;dy<=cg;dy++)for(let dx=-cg;dx<=cg;dx++){
    if(dx*dx+dy*dy<=cg*cg){
      const i=idx(cgx+dx,cgy+dy);
      const d=P[i]*frac; P[i]-=d; eaten+=d;
    }
  }
  return eaten;
}

/* ---------- genome ---------- */
const G0={metab:0.00055, sens:0.80, suck:0.10, pulse:1.0, topt:0.5, noci:0.28, comX:0, comY:0};   // founding values
function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function mutate(g){
  return {
    metab: clamp(g.metab*Math.exp(0.13*gauss()), 0.0002, 0.0020),
    sens:  clamp(g.sens *Math.exp(0.13*gauss()), 0.20,   1.30),
    suck:  clamp(g.suck *Math.exp(0.13*gauss()), 0.03,   0.26),
    pulse: clamp(g.pulse*Math.exp(0.13*gauss()), 0.50,   2.00),
    topt:  clamp(g.topt + 0.05*gauss(),           0.05,   0.95),
    noci:  clamp((g.noci===undefined?0.28:g.noci) + 0.04*gauss(), 0.05, 0.45),
    comX:  clamp((g.comX||0) + 0.05*gauss(), -0.45, 0.45),
    comY:  clamp((g.comY||0) + 0.05*gauss(), -0.45, 0.45),
  };
}
function jitter(g){ const m=mutate(g); return mutate(m); }   // founders: 2x mutation spread
function mutatePms(pms){                    // body-plan mutation: migrate / retime / duplicate / delete
  let out=pms.map(p=>{
    let c=p.cell;
    if(Math.random()<0.15) c=((c+(Math.random()<0.5?1:-1))%N+N)%N;   // pacemaker migrates one cell
    return {cell:c, base:clamp(Math.round(p.base*Math.exp(0.06*gauss())),24,70)};
  });
  if(out.length<4 && Math.random()<0.06){    // duplication
    const src=out[(Math.random()*out.length)|0];
    out.push({cell:((src.cell+(Math.random()<0.5?2:-2))%N+N)%N, base:src.base});
  }
  if(out.length>1 && Math.random()<0.06)     // deletion
    out.splice((Math.random()*out.length)|0,1);
  return out;
}
function hueOf(g){
  // thermal lineage is the primary axis: cold-adapted=blue(230) -> warm-adapted=orange(20)
  const h=230 - 210*g.topt + 40*(g.metab/G0.metab-1) + 20*(g.pulse-1);
  return ((h%360)+360)%360;
}
let tempMap=null;                          // raw color-temperature per cell (photo mode)
function tempRawAt(x,y){
  if(tempMap) return tempMap[idx(Math.floor(x/CS),Math.floor(y/CS))];
  return 1 - y/H;                          // default: warm surface, cold depth
}
function tempAt(x,y){ const t=tempRawAt(x,y); return t<0?0:(t>1?1:t); }

/* ---------- jelly ---------- */
let births=0, deaths=0;
function makeJelly(x,y,genome,inheritPms){
  const g=genome||jitter(G0);
  const pms=[];
  if(inheritPms){
    for(const pm of inheritPms) pms.push({cell:pm.cell, base:pm.base, timer:1+((Math.random()*20)|0)});
  }else{
    const pcount=2+((Math.random()*2)|0), used=new Set();
    for(let p=0;p<pcount;p++){
      let c; do{ c=(Math.random()*N)|0; }while(used.has(c)); used.add(c);
      pms.push({cell:c, base:38+((Math.random()*18)|0), timer:1+((Math.random()*30)|0)});
    }
  }
  return {
    E:new Float32Array(N), R:new Int16Array(N), A:new Float32Array(N),
    contract:new Float32Array(N), syn:new Float32Array(N).fill(1), pms, pmSet:new Set(pms.map(p=>p.cell)), g, hue:hueOf(g),
    x,y,vx:0,vy:0, th:Math.random()*6.2832, om:0, r:10,
    h:0.5, fed:0, starve:0, dying:0, age:0, burn:0,
    trail:[], pokeFlash:0
  };
}
function pokeJelly(j,cell){
  if(j.R[cell]!==0) return null;
  j.E[cell]=EMAX;
  const amp=j.syn[cell];                   // response scales with synaptic efficacy
  j.A[cell]=amp;
  j.R[cell]=R0; j.pokeFlash=18;
  for(let k=-2;k<=2;k++){                  // site-specific habituation, spreading to neighbors
    const c=((cell+k)%N+N)%N;
    j.syn[c]=Math.max(0.12, j.syn[c]*(k===0?0.6:0.8));
  }
  return amp;
}
function stepJelly(j,t){
  if(j.dying>0){ j.dying--; j.vy+=0.02; j.vx*=0.96; j.vy*=0.99;
    j.x+=j.vx; j.y+=j.vy; return; }
  const Traw=tempRawAt(j.x,j.y);
  const dmg=Math.max(0, Traw-1.05, -(Traw+0.05));      // graded: edges hurt slowly, the core kills fast
  if(dmg>0){ j.burn+=dmg*260; j.h=Math.min(1,j.h+dmg*0.25); }
  else j.burn*=0.9;
  const T=tempAt(j.x,j.y);
  // nociception: a rim cell in scalding/freezing water fires by itself.
  // no avoidance is coded — the verified escape wave does the steering.
  // pain bypasses habituation (biology: nociceptors do not habituate).
  const hotPain=1.30-(j.g.noci===undefined?0.28:j.g.noci), coldPain=-0.30+(j.g.noci===undefined?0.28:j.g.noci);
  for(let ci=0;ci<N;ci++){
    if(j.R[ci]!==0) continue;
    const ca=j.th+2*Math.PI*ci/N;
    const Tc=tempRawAt(j.x+j.r*Math.cos(ca), j.y+j.r*Math.sin(ca));
    if(Tc>hotPain||Tc<coldPain){
      j.E[ci]=EMAX; j.A[ci]=1.0; j.R[ci]=R0;
      break;                                           // one pain volley per tick
    }
  }
  const perf=Math.exp(-Math.pow((T-j.g.topt)/0.16,2));   // mismatch penalty (sharp: regime shifts are lethal by design)
  const paceScale=Math.max(0.35, 1.35 - j.g.sens*j.h);
  for(const pm of j.pms){
    pm.timer--;
    if(pm.timer<=0){
      if(j.R[pm.cell]===0){ j.E[pm.cell]=EMAX; j.A[pm.cell]=1.0; j.R[pm.cell]=R0; }
      pm.timer=Math.max(8,Math.round(pm.base*j.g.pulse*paceScale));
    }
  }
  const fired=stepAmp(j);
  let pulse=0;
  const cbx=(j.g.comX||0)*j.r, cby=(j.g.comY||0)*j.r;      // COM offset, body frame
  const cwx=cbx*Math.cos(j.th)-cby*Math.sin(j.th);          // -> world frame
  const cwy=cbx*Math.sin(j.th)+cby*Math.cos(j.th);
  for(const [i,amp] of fired){
    const a=j.th+2*Math.PI*i/N;                             // cells live in the body frame now
    const thr=THRUST*j.r*(0.55+0.45*perf);
    const fx=-amp*Math.cos(a)*thr, fy=-amp*Math.sin(a)*thr;
    j.vx+=fx; j.vy+=fy;
    const lx=Math.cos(a)*j.r-cwx, ly=Math.sin(a)*j.r-cwy;   // lever arm from COM to rim
    j.om+=(lx*fy-ly*fx)*0.0022;                             // off-center thrust -> spin
    j.contract[i]=Math.min(1,j.contract[i]+0.85*amp);
    pulse+=amp;
  }
  if(tiltMode!==0)                                          // buoyancy(center) vs weight(COM): righting couple
    j.om+=(cwx*gvy-cwy*gvx)*gStrength*0.0035;
  j.om*=0.93; j.th+=j.om;
  if(pulse>0){
    const eaten=fieldEat(j.x,j.y,j.r*1.7,j.g.suck*perf*Math.min(1,pulse));
    j.h=Math.max(0, j.h - eaten*0.5);   // assimilation efficiency (world constant)
  }
  j.age++;
  j.h=Math.min(1, j.h + j.g.metab*(0.45+0.75*T));   // Q10 coupling (gentler world constant)
  // selection bookkeeping: sustained satiety -> divide; sustained famine -> die
  if(j.h<0.35) j.fed += (0.35-j.h); else j.fed=Math.max(0,j.fed-0.02);
  if(j.h>0.93) j.starve++; else j.starve=0;
  for(let i=0;i<N;i++){
    j.contract[i]*=0.78;
    j.syn[i]+=(1-j.syn[i])*0.0012;         // habituation recovers over ~13s
  }
  j.vx+=gvx*0.04*gStrength; j.vy+=gvy*0.04*gStrength;   // passive sinking (tilt x slider)
  j.vx*=(1-DRAG); j.vy*=(1-DRAG);
  j.x+=j.vx; j.y+=j.vy;
  if(j.x<0)j.x+=W; if(j.x>=W)j.x-=W;
  if(j.y<0)j.y+=H; if(j.y>=H)j.y-=H;
  if(t%3===0){ const tm=jellies.length>60?140:420;
    j.trail.push(j.x,j.y); if(j.trail.length>tm)j.trail.splice(0,2); }
  if(j.pokeFlash>0)j.pokeFlash--;
}

/* ---------- world ---------- */
const cv=document.getElementById('tank'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  rebuildField();
  buildLight();
}
addEventListener('resize',resize); resize();

const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
let jellies=[];
let lineageRestored=false;
(async function boot(){
  let founders=null;
  try{
    if(window.storage){
      const res=await window.storage.get('jelly-founders');
      if(res && res.value){ founders=JSON.parse(res.value); }
    }
  }catch(e){ /* first run: key absent */ }
  if(founders && founders.length>=3){
    for(let i=0;i<6;i++){
      const f=founders[(Math.random()*founders.length)|0];
      const g=mutate(f.g||f);                          // new {g,pms} or legacy plain-genome
      const pms=f.pms?mutatePms(f.pms):null;
      jellies.push(makeJelly(W*(0.2+Math.random()*0.6), H*(0.2+Math.random()*0.6), g, pms));
    }
    lineageRestored=true;
  }else{
    jellies.push(makeJelly(W*0.3,H*0.4), makeJelly(W*0.7,H*0.35), makeJelly(W*0.5,H*0.7));
  }
})();
const MAXPOP=260;                   // perf guard, above expected carrying capacity (~120) + overshoot
const ripples=[];
const labels=[];
const specks=[];
for(let i=0;i<150;i++) specks.push({x:Math.random()*W,y:Math.random()*H,
  s:0.5+Math.random()*1.3, dx:(Math.random()-0.5)*0.12, dy:(Math.random()-0.5)*0.08});

let dwellRight=0, dwellAll=0;
const hist={pop:[],food:[]};           // time series for the mini chart
let meanH=0, foodStock=0;

let hintTimer=null;
function tap(px,py){
  let best=null,bd=1e9;
  for(const j of jellies){
    if(j.dying>0)continue;
    const d=(j.x-px)**2+(j.y-py)**2;
    if(d<bd){bd=d;best=j;}
  }
  if(best && bd < 55*55){
    ripples.push({x:px,y:py,r:6,a:0.55,c:'94,232,216'});
    const ang=Math.atan2(py-best.y,px-best.x);
    let cell=Math.round((ang-best.th)/(2*Math.PI)*N); cell=((cell%N)+N)%N;
    const amp=pokeJelly(best,cell);
    if(amp!==null) labels.push({x:best.x,y:best.y-best.r-10,txt:((amp*100)|0)+'%',a:1});
  }else{
    ripples.push({x:px,y:py,r:6,a:0.5,c:'184,255,123'});
    fieldDeposit(px,py,0.55,58);
  }
  document.getElementById('hint').style.opacity=0; clearTimeout(hintTimer);
}
let pStart=null, pMoved=false;
cv.addEventListener('pointerdown',e=>{ pStart=[e.clientX,e.clientY]; pMoved=false; });
cv.addEventListener('pointermove',e=>{
  if(!pStart) return;
  const dx=e.clientX-pStart[0], dy=e.clientY-pStart[1];
  if(dx*dx+dy*dy>18*18){
    pMoved=true;
    if(tiltMode===2){                               // swipe sets the gravity vector
      gvx=Math.max(-1,Math.min(1,dx/140));
      gvy=Math.max(-1,Math.min(1,dy/140));
    }
  }
});
cv.addEventListener('pointerup',e=>{
  if(pStart && !pMoved) tap(e.clientX,e.clientY);
  pStart=null;
});

let paused=false;
document.getElementById('btnPause').onclick=e=>{
  paused=!paused;
  e.target.textContent=paused?'▶ play':'⏸ pause';
};
let gvx=0, gvy=0, tiltMode=0, sensorGot=false;   // 0=off 1=sensor 2=swipe
let gStrength=1;
document.getElementById('gravSlider').oninput=e=>{
  gStrength=e.target.value/100;
  document.getElementById('gravVal').textContent='g \u00d7'+gStrength.toFixed(1);
};
function tiltHandler(ev){
  if(ev.beta===null && ev.gamma===null) return;
  sensorGot=true;
  gvx=Math.max(-1,Math.min(1,(ev.gamma||0)/90));
  gvy=Math.max(-1,Math.min(1,(ev.beta ||0)/90));
}
document.getElementById('btnTilt').onclick=async e=>{
  const btn=e.target;
  if(tiltMode!==0){                                 // any-on -> off
    removeEventListener('deviceorientation',tiltHandler);
    gvx=0; gvy=0; tiltMode=0; btn.textContent='🧭 tilt';
    document.getElementById('gravRow').style.display='none';
    return;
  }
  let granted=true;
  try{
    if(window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission){
      granted=(await DeviceOrientationEvent.requestPermission())==='granted';
    }
  }catch(err){ granted=false; }
  if(granted){
    sensorGot=false;
    addEventListener('deviceorientation',tiltHandler);
    tiltMode=1; btn.textContent='🧭 tilt on';
    document.getElementById('gravRow').style.display='flex';
    setTimeout(()=>{                                // sandboxed iframe: no events arrive
      if(tiltMode===1 && !sensorGot){
        removeEventListener('deviceorientation',tiltHandler);
        tiltMode=2; btn.textContent='🧭 swipe tilt';
      }
    },1200);
  }else{
    tiltMode=2; btn.textContent='🧭 swipe tilt';    // permission unavailable -> swipe
    document.getElementById('gravRow').style.display='flex';
  }
};
document.getElementById('btnLight').onclick=()=>document.getElementById('lightInput').click();
document.getElementById('lightInput').onchange=e=>{
  if(e.target.files && e.target.files[0]) setLightFromFile(e.target.files[0]);
};
document.getElementById('btnAdd').onclick=()=>{
  if(jellies.length<MAXPOP)
    jellies.push(makeJelly(W*(0.2+Math.random()*0.6), H*(0.2+Math.random()*0.6)));
};

/* ---------- render ---------- */
function hsla(hue,s,l,a){ return `hsla(${hue.toFixed(0)},${s}%,${l}%,${a})`; }
function drawJelly(j){
  const fade=j.dying>0?j.dying/60:1;
  if(j.trail.length>=4 && j.dying===0){
    ctx.beginPath();
    ctx.moveTo(j.trail[0],j.trail[1]);
    for(let i=2;i<j.trail.length;i+=2){
      const dx=Math.abs(j.trail[i]-j.trail[i-2]);
      const dy=Math.abs(j.trail[i+1]-j.trail[i-1]);
      if(dx>W/2||dy>H/2) ctx.moveTo(j.trail[i],j.trail[i+1]);
      else ctx.lineTo(j.trail[i],j.trail[i+1]);
    }
    ctx.strokeStyle=hsla(j.hue,55,32,0.32); ctx.lineWidth=1; ctx.stroke();
  }
  const edge=j.r*1.6, offs=[[0,0]];
  if(j.x<edge)offs.push([W,0]); if(j.x>W-edge)offs.push([-W,0]);
  if(j.y<edge)offs.push([0,H]); if(j.y>H-edge)offs.push([0,-H]);
  if(offs.length===3)offs.push([offs[1][0],offs[2][1]]);
  for(const [ox,oy] of offs) drawBody(j, j.x+ox, j.y+oy, fade);
}
let FANCY=true;
function drawBody(j,cx,cy,fade){
  const px=[],py=[];
  for(let i=0;i<N;i++){
    const rr=j.r*(1-0.5*j.contract[i]);
    const a=j.th+2*Math.PI*i/N;
    px.push(cx+rr*Math.cos(a)); py.push(cy+rr*Math.sin(a));
  }
  const sat=1-j.h;
  if(FANCY){
    const g=ctx.createRadialGradient(cx,cy,2,cx,cy,j.r*1.25);
    const flash=(j.pokeFlash>0?0.22:0.10+0.10*sat)*fade;
    g.addColorStop(0,hsla(j.hue,80,66,flash+0.12*fade));
    g.addColorStop(0.7,hsla(j.hue,80,66,flash*0.5));
    g.addColorStop(1,hsla(j.hue,80,66,0));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(cx,cy,j.r*1.25,0,7); ctx.fill();
  }
  ctx.beginPath();
  ctx.moveTo((px[N-1]+px[0])/2,(py[N-1]+py[0])/2);
  for(let i=0;i<N;i++){
    const k=(i+1)%N;
    ctx.quadraticCurveTo(px[i],py[i],(px[i]+px[k])/2,(py[i]+py[k])/2);
  }
  ctx.closePath();
  ctx.strokeStyle=hsla(j.hue,75,64,(0.55+0.35*sat)*fade); ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle=hsla(j.hue,60,30,(0.12+0.10*sat)*fade); ctx.fill();
  for(let i=0;i<N;i++){
    let c, s=1.9;
    if(j.contract[i]>0.25){ c=`rgba(255,162,77,${fade})`; s=3.0; }
    else if(j.R[i]>0){ c=`rgba(150,168,180,${0.55*fade})`; }
    else c=hsla(j.hue,80,70,0.9*fade);
    ctx.fillStyle=c;
    ctx.beginPath(); ctx.arc(px[i],py[i],s,0,7); ctx.fill();
    if(j.pmSet && j.pmSet.has(i)){                     // pacemaker marker
      ctx.strokeStyle=`rgba(255,255,255,${0.7*fade})`; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(px[i],py[i],s+1.7,0,7); ctx.stroke();
    }
  }
  if(j.g.comX||j.g.comY){                              // visible center of mass
    const bx=(j.g.comX||0)*j.r, by=(j.g.comY||0)*j.r;
    const mx=cx+bx*Math.cos(j.th)-by*Math.sin(j.th);
    const my=cy+bx*Math.sin(j.th)+by*Math.cos(j.th);
    ctx.fillStyle=`rgba(255,255,255,${0.45*fade})`;
    ctx.beginPath(); ctx.arc(mx,my,1.6,0,7); ctx.fill();
  }
  // hunger ring: green=sated -> red=starving
  if(fade>=1){
    ctx.beginPath();
    ctx.arc(cx,cy,j.r*1.42,-Math.PI/2,-Math.PI/2+6.2832*j.h);
    ctx.strokeStyle=`hsla(${((1-j.h)*120)|0},85%,55%,0.5)`;
    ctx.lineWidth=1.4; ctx.stroke();
  }
}

let t=0;
function frame(){
  if(!paused){
    t++;
    FANCY=jellies.length<=90;
    fieldStep();
    const born=[];
    for(const j of jellies){
      stepJelly(j,t);
      if(j.dying>0)continue;
      dwellAll++; if(j.x>=W/2)dwellRight++;
      if(j.starve>300 || j.burn>300){ j.dying=60; deaths++; continue; }
      if(j.fed>32 && jellies.length+born.length<MAXPOP){
        j.fed=0; j.h=Math.min(1,j.h+0.25);        // division costs energy
        const a=Math.random()*6.283, d=j.r*2.2;
        const child=makeJelly(j.x+Math.cos(a)*d, j.y+Math.sin(a)*d, mutate(j.g), mutatePms(j.pms));
        child.h=0.45; born.push(child); births++;
      }
    }
    // physical exclusion: soft collisions, and crowding costs energy
    for(let ci=0;ci<jellies.length;ci++){
      const ja=jellies[ci]; if(ja.dying>0)continue;
      for(let cj=ci+1;cj<jellies.length;cj++){
        const jb=jellies[cj]; if(jb.dying>0)continue;
        let dx=jb.x-ja.x, dy=jb.y-ja.y;
        if(dx>W/2)dx-=W; else if(dx<-W/2)dx+=W;   // torus metric
        if(dy>H/2)dy-=H; else if(dy<-H/2)dy+=H;
        const rr=ja.r+jb.r, d2=dx*dx+dy*dy;
        if(d2<rr*rr && d2>0.01){
          const d=Math.sqrt(d2), ov=(rr-d)/rr;
          const nx=dx/d, ny=dy/d, f=0.22*ov;
          ja.vx-=nx*f; ja.vy-=ny*f;
          jb.vx+=nx*f; jb.vy+=ny*f;
          ja.h=Math.min(1,ja.h+0.0009*ov);        // jostling burns energy
          jb.h=Math.min(1,jb.h+0.0009*ov);
        }
      }
    }
    jellies.push(...born);
    jellies=jellies.filter(j=>!(j.dying===1));    // remove fully faded
    if(t%20===0){
      let sum=0; for(let i=0;i<P.length;i++)sum+=P[i];
      foodStock=sum/P.length;
      let hs=0,na=0; for(const j of jellies){ if(j.dying===0){hs+=j.h;na++;} }
      meanH=na?hs/na:0;
      hist.pop.push(jellies.length); hist.food.push(foodStock);
      if(hist.pop.length>200){hist.pop.shift();hist.food.shift();}
    }
    if(t%900===0 && window.storage){          // heredity across sessions
      try{
        const alive=jellies.filter(j=>j.dying===0).sort((a,b)=>b.age-a.age).slice(0,10);
        if(alive.length>=3){
          const p=window.storage.set('jelly-founders', JSON.stringify(alive.map(j=>({g:j.g, pms:j.pms.map(q=>({cell:q.cell,base:q.base}))}))));
          if(p&&p.catch)p.catch(()=>{});
        }
      }catch(e){}
    }
    if(!reduceMotion){
      for(const s of specks){
        s.x+=s.dx; s.y+=s.dy;
        if(s.x<0)s.x+=W; if(s.x>=W)s.x-=W; if(s.y<0)s.y+=H; if(s.y>=H)s.y-=H;
      }
      for(let k=0;k<12;k++){
        const s=specks[(Math.random()*specks.length)|0];
        if(fieldAt(s.x,s.y)>0.25 && Math.random()<0.7)continue;
        const rx=Math.random()*W, ry=Math.random()*H;
        if(Math.random()<fieldAt(rx,ry)){ s.x=rx; s.y=ry; }
      }
    }
  }
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0a1626'); bg.addColorStop(1,'#020d1c');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  if(lightBg){ ctx.globalAlpha=0.13; ctx.drawImage(lightBg,0,0,W,H); ctx.globalAlpha=1; }
  if(!tempMap){
    const th=ctx.createLinearGradient(0,0,0,H);        // default stratification
    th.addColorStop(0,'rgba(255,150,70,0.05)');
    th.addColorStop(1,'rgba(70,130,255,0.06)');
    ctx.fillStyle=th; ctx.fillRect(0,0,W,H);
  }else{
    for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){  // mark lethal water
      const tr=tempMap[idx(gx,gy)];
      if(tr>1.15){ ctx.fillStyle='rgba(255,60,40,0.10)'; ctx.fillRect(gx*CS,gy*CS,CS,CS); }
      else if(tr<-0.15){ ctx.fillStyle='rgba(60,120,255,0.12)'; ctx.fillRect(gx*CS,gy*CS,CS,CS); }
    }
  }
  if(!lightMap){
    ctx.strokeStyle='rgba(140,190,210,0.10)'; ctx.setLineDash([3,7]);
    ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();
    ctx.setLineDash([]);
  }
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){
    const p=P[idx(gx,gy)];
    if(p<0.03)continue;
    ctx.fillStyle=`rgba(120,210,170,${Math.min(0.26,Math.pow(p,0.8)*0.28)})`;
    ctx.fillRect(gx*CS,gy*CS,CS,CS);
  }
  for(const s of specks){
    const p=fieldAt(s.x,s.y);
    if(p<0.12)continue;
    ctx.fillStyle=`rgba(190,240,205,${0.15+0.5*p})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.s,0,7); ctx.fill();
  }
  for(let i=ripples.length-1;i>=0;i--){
    const rp=ripples[i];
    ctx.strokeStyle=`rgba(${rp.c},${rp.a})`; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(rp.x,rp.y,rp.r,0,7); ctx.stroke();
    rp.r+=2.4; rp.a-=0.02;
    if(rp.a<=0)ripples.splice(i,1);
  }
  for(let i=labels.length-1;i>=0;i--){
    const L=labels[i];
    ctx.fillStyle=`rgba(230,245,255,${L.a})`;
    ctx.font='11px ui-monospace,monospace';
    ctx.fillText(L.txt,L.x+6,L.y);
    L.y-=0.4; L.a-=0.02;
    if(L.a<=0)labels.splice(i,1);
  }
  for(const j of jellies) drawJelly(j);
  if(hist.pop.length>2){
    const cw=132, ch=34, cx0=W-cw-14, cy0=124;
    ctx.fillStyle='rgba(6,20,32,0.55)'; ctx.fillRect(cx0-4,cy0-4,cw+8,ch+8);
    const mp=Math.max(10,...hist.pop);
    ctx.beginPath();
    hist.pop.forEach((v,i)=>{const x=cx0+cw*i/(hist.pop.length-1),y=cy0+ch*(1-v/mp);
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.strokeStyle='rgba(220,235,245,0.8)'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.beginPath();
    hist.food.forEach((v,i)=>{const x=cx0+cw*i/(hist.food.length-1),y=cy0+ch*(1-Math.min(1,v));
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    ctx.strokeStyle='rgba(120,220,170,0.8)'; ctx.lineWidth=1.2; ctx.stroke();
  }
  if(tiltMode!==0){
    const gx0=W-34, gy0=182, gr=15;
    ctx.strokeStyle='rgba(160,200,220,0.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(gx0,gy0,gr,0,7); ctx.stroke();
    const m=Math.hypot(gvx,gvy);
    if(m>0.02){
      const ux=gvx/m, uy=gvy/m, L=gr*Math.min(1,m);
      ctx.strokeStyle='rgba(94,232,216,0.9)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(gx0,gy0); ctx.lineTo(gx0+ux*L,gy0+uy*L); ctx.stroke();
      ctx.fillStyle='rgba(94,232,216,0.9)';
      ctx.beginPath(); ctx.arc(gx0+ux*L,gy0+uy*L,2.5,0,7); ctx.fill();
    }else{
      ctx.fillStyle='rgba(160,200,220,0.6)';
      ctx.beginPath(); ctx.arc(gx0,gy0,2,0,7); ctx.fill();
    }
    ctx.fillStyle='rgba(160,200,220,0.6)'; ctx.font='9px ui-monospace,monospace';
    ctx.textAlign='center';
    ctx.fillText('g '+(m*gStrength).toFixed(2), gx0, gy0+gr+11);
    ctx.textAlign='start';
  }
  const rd=dwellAll>0?Math.round(100*dwellRight/dwellAll):50;
  const mm=(t/3600)|0, ss=((t/60)|0)%60;
  document.getElementById('tick').textContent=
    't='+t+' ('+mm+'m'+(ss<10?'0':'')+ss+'s)\n'+
    'pop '+jellies.length+' (+'+births+' \u2212'+deaths+')\n'+
    'h\u0304 '+meanH.toFixed(2)+' \u00b7 food '+(foodStock*100).toFixed(0)+'%\n'+
    'dwell '+rd+'%'+(lineageRestored?' \u00b7 \u267b':'');
  requestAnimationFrame(frame);
}
hintTimer=setTimeout(()=>{document.getElementById('hint').style.opacity=0;},11000);
requestAnimationFrame(frame);
</script>
</body>
